[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymanager"
version = "0.1.0"
description = "Safety-first automated trading agent for Polymarket"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["app", "app.strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
